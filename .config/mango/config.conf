# More option see https://github.com/DreamMaoMao/mango/wiki/

#env=DISPLAY,:3
exec_once=dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP
exec_once=dinitctl --user setenv WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP
exec_once=xwayland-satellite :3

# Monitor rules
monitor_rule=make:Invalid Vendor Codename - RTK,model:HG590T59,width:3840,height:2160,refresh:120.000000,x:0,y:0,scale:2,vrr:1

# Startup
exec_once=awww-daemon

sync_obj_enable=1

# Window effect
blur=0
blur_layer=0
blur_optimized=1

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=2
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=0
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=0

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.62
default_master_count=1
smart_gaps=0
center_master_overspread=1
center_when_single_stack=0
deck_tab_mode=1
monocle_tab_mode=1
# monocle_no_border=1
# monocle_no_gap=1

# Overview Setting
# enable_hotarea=0
# ov_tab_mode=0

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:lalt_lshift_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
trackpad_accel_profile=1
trackpad_accel_speed=0.8
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=-0.6

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x0f3b3aff
focus_color=0xff8E8Bff
# maximize_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Tab bar
tab_bar_height=20
tab_bar_decorate_border_width=2
tab_bar_decorate_corner_radius=2
tab_bar_decorate_bg_color=0x0f3b3aff
tab_bar_decorate_fg_color=0xfafafaff
tab_bar_decorate_focus_bg_color=0xff8E8Bff
tab_bar_decorate_focus_fg_color=0x0f3b3aff
tab_bar_decorate_border_color=0x0f3b3aff
tab_bar_decorate_padding_y=0
# tab_bar_decorate_font_desc="IBM Plex Mono"

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:deck
tag_rule=id:2,layout_name:deck
tag_rule=id:3,layout_name:deck
tag_rule=id:4,layout_name:deck
tag_rule=id:5,layout_name:deck
tag_rule=id:6,layout_name:deck
tag_rule=id:7,layout_name:deck
tag_rule=id:8,layout_name:deck
tag_rule=id:9,layout_name:deck

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# screengrab
bind=SUPER,s,spawn_shell,screengrab.fish
bind=SUPER+SHIFT,s,spawn_shell,screengrab.fish 1

# menu and terminal
bind=SUPER,d,spawn,foot -a launcher "launch.fish"
bind=SUPER,t,spawn,foot

# exit
bind=SUPER+SHIFT,q,quit
bind=SUPER,x,killclient,

# navigation
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,m,zoom

# windows
bind=SUPER,v,togglefloating,
# switching between the fullscreen-style monocle and tiles
circle_layout=monocle,deck
bind=SUPER,f,switch_layout
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+CTRL,f,togglefakefullscreen

# tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=SUPER+CTRL,1,tagsilent,1,0
bind=SUPER+CTRL,2,tagsilent,2,0
bind=SUPER+CTRL,3,tagsilent,3,0
bind=SUPER+CTRL,4,tagsilent,4,0
bind=SUPER+CTRL,5,tagsilent,5,0
bind=SUPER+CTRL,6,tagsilent,6,0
bind=SUPER+CTRL,7,tagsilent,7,0
bind=SUPER+CTRL,8,tagsilent,8,0
bind=SUPER+CTRL,9,tagsilent,9,0

# switching monitors
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+ALT,h,tagmon,left
bind=SUPER+ALT,l,tagmon,right

# movewin
# bind=CTRL+SHIFT,Up,movewin,+0,-50
# bind=CTRL+SHIFT,Down,movewin,+0,+50
# bind=CTRL+SHIFT,Left,movewin,-50,+0
# bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+SHIFT,k,resizewin,+0,-50
bind=SUPER+SHIFT,j,resizewin,+0,+50
bind=SUPER+SHIFT,h,resizewin,-50,+0
bind=SUPER+SHIFT,l,resizewin,+50,+0

# window rules
window_rule=width:300,height:400,app_id:launcher,is_overlay:1,is_floating:1,offset_y:100,offset_x:-100
window_rule=allow_csd:1,app_id:firefox